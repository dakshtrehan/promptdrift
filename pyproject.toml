[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdrift"
dynamic = ["version"]
description = "Semantic, structural and check-based diff for LLM prompts and model outputs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daksh Trehan", email = "dakshtrehan111@gmail.com" }]
keywords = ["llm", "prompts", "diff", "drift", "testing", "evaluation", "ai", "genai", "semantic", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
all = ["openai>=1.0", "anthropic>=0.20"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "build>=1.0",
    "twine>=5.0",
    "openai>=1.0",
    "anthropic>=0.20",
]

[project.urls]
Homepage = "https://github.com/dakshtrehan/promptdrift"
Repository = "https://github.com/dakshtrehan/promptdrift"
Issues = "https://github.com/dakshtrehan/promptdrift/issues"
Changelog = "https://github.com/dakshtrehan/promptdrift/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dakshtrehan/promptdrift#readme"

[project.scripts]
promptdrift = "promptdrift.cli:main"

[tool.setuptools.dynamic]
version = { attr = "promptdrift.version.__version__" }

[tool.setuptools.packages.find]
include = ["promptdrift*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["promptdrift"]

[tool.coverage.report]
fail_under = 90
show_missing = true
