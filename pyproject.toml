[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdrift"
version = "0.1.1"
description = "Semantic diff for LLM prompts and model outputs. Catch regressions before they hit prod."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daksh Trehan", email = "dakshtrehan111@gmail.com" }]
keywords = ["llm", "prompts", "diff", "drift", "testing", "evaluation", "ai", "genai", "semantic", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
all = ["openai>=1.0", "anthropic>=0.20"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "build",
    "twine",
    "openai>=1.0",
    "anthropic>=0.20",
]

[project.urls]
Homepage = "https://github.com/dakshtrehan/promptdrift"
Repository = "https://github.com/dakshtrehan/promptdrift"
Issues = "https://github.com/dakshtrehan/promptdrift/issues"
Changelog = "https://github.com/dakshtrehan/promptdrift/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dakshtrehan/promptdrift#readme"

[project.scripts]
promptdrift = "promptdrift.cli:main"

[tool.setuptools.packages.find]
include = ["promptdrift*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
