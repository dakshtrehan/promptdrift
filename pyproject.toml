[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdrift"
dynamic = ["version"]
description = "Semantic, structural and check-based diff for LLM prompts and model outputs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daksh Trehan", email = "dakshtrehan111@gmail.com" }]
keywords = ["llm", "prompts", "diff", "drift", "testing", "evaluation", "ai", "genai", "semantic", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
watch = ["watchdog>=3.0"]
# mirrors docs/requirements.txt
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.26,<1",
        "pymdown-extensions>=10,<11"]
all = ["openai>=1.0", "anthropic>=0.20"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
    "build>=1.0",
    "twine>=5.0",
    "openai>=1.0",
    "anthropic>=0.20",
]

[project.urls]
Homepage = "https://github.com/dakshtrehan/promptdrift"
Repository = "https://github.com/dakshtrehan/promptdrift"
Issues = "https://github.com/dakshtrehan/promptdrift/issues"
Changelog = "https://github.com/dakshtrehan/promptdrift/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dakshtrehan/promptdrift#readme"

[project.scripts]
promptdrift = "promptdrift.cli:main"

[project.entry-points.pytest11]
# a thin shim that imports promptdrift.pytest_plugin only when --promptdrift is used
promptdrift = "_promptdrift_pytest"

[tool.setuptools.dynamic]
version = { attr = "promptdrift.version.__version__" }

[tool.setuptools]
py-modules = ["_promptdrift_pytest"]

[tool.setuptools.packages.find]
include = ["promptdrift*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["promptdrift", "action"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
# mypy 2.x cannot target 3.9 (the oldest it accepts is 3.10); the 3.9 interpreter
# in the CI matrix and "python -m compileall" cover 3.9 syntax compatibility.
python_version = "3.10"
strict = true
packages = ["promptdrift"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
# Optional SDKs and runtime-only imports (openai, anthropic, requests, watchdog)
# are not installed in every environment and their type information changes
# between releases. They are treated as untyped everywhere so that the type
# gate gives the same answer with or without the extras installed.
module = ["openai", "openai.*", "anthropic", "anthropic.*", "requests", "requests.*",
          "watchdog", "watchdog.*"]
ignore_missing_imports = true
follow_imports = "skip"
