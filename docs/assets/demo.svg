<text x="18" y="604" xml:space="preserve"></text>
<text x="18" y="624" xml:space="preserve"><tspan fill="#ff8c37" font-weight="bold">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text>
