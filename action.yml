name: "promptdrift"
description: >-
  Catch LLM prompt regressions in CI: compare two prompt versions or logged
  outputs, post or update one pull request comment with drift, check flips,
  format changes and confidence intervals, upload the HTML report as an
  artifact and fail on configurable thresholds.
author: "Daksh Trehan"

branding:
  icon: "activity"
  color: "orange"

inputs:
  outputs:
    description: >-
      Path to a JSONL (or JSON array) file of logged outputs with case_id,
      output_a and output_b. When set, the action runs "promptdrift diff"
      offline and calls no model.
    required: false
    default: ""
  config-a:
    description: "Baseline prompt config (YAML/JSON). Live mode, used only when outputs is empty."
    required: false
    default: ""
  config-b:
    description: "New prompt config (YAML/JSON). Live mode, used only when outputs is empty."
    required: false
    default: ""
  cases:
    description: "Test cases file (JSON/JSONL/YAML). Live mode only."
    required: false
    default: ""
  checks:
    description: "Default deterministic checks file (JSON/YAML) for cases without their own."
    required: false
    default: ""
  samples:
    description: "Samples per side per case in live mode (more than 1 reports a noise floor)."
    required: false
    default: "1"
  judge:
    description: >-
      Run the LLM judge ("true" or "false"). Off by default: offline mode never
      calls a model unless this is true, and live mode passes --no-judge.
    required: false
    default: "false"
  judge-provider:
    description: "Judge provider: openai, anthropic or ollama (default from the environment)."
    required: false
    default: ""
  judge-model:
    description: "Judge model name (default depends on the provider)."
    required: false
    default: ""
  similarity:
    description: "Similarity backend in live mode: tfidf (free, offline) or embedding."
    required: false
    default: "tfidf"
  max-drift:
    description: "Fail when average drift exceeds this fraction (0.1 means 10 percent)."
    required: false
    default: ""
  max-regressions:
    description: "Fail when more than this many cases regressed."
    required: false
    default: ""
  max-format-changes:
    description: "Fail when more than this many cases changed output format."
    required: false
    default: ""
  max-flips:
    description: "Fail when more than this many checks flipped from pass to fail."
    required: false
    default: ""
  fail-on-regression:
    description: "Fail the job when any case regressed."
    required: false
    default: "true"
  comment:
    description: "Post or update a single summary comment on the pull request."
    required: false
    default: "true"
  comment-marker:
    description: "Hidden HTML comment used to find and update the action's own PR comment."
    required: false
    default: "<!-- promptdrift-report -->"
  step-summary:
    description: "Write the Markdown summary to the job summary (GITHUB_STEP_SUMMARY)."
    required: false
    default: "true"
  artifact-name:
    description: "Name of the uploaded artifact holding the report files."
    required: false
    default: "promptdrift-report"
  upload-artifact:
    description: "Upload the report directory as a workflow artifact."
    required: false
    default: "true"
  report-dir:
    description: "Directory (relative to working-directory) that receives report.json, .html, .junit.xml and .csv."
    required: false
    default: "promptdrift-report"
  python-version:
    description: "Python version for actions/setup-python."
    required: false
    default: "3.12"
  github-token:
    description: "Token used to post the PR comment. Needs pull-requests: write."
    required: false
    default: ${{ github.token }}
  working-directory:
    description: "Directory to run promptdrift in."
    required: false
    default: "."
  extra-args:
    description: "Extra CLI arguments appended to the promptdrift command (split on whitespace)."
    required: false
    default: ""
  install:
    description: >-
      How to install promptdrift: "action" (pip install from the action's own
      checkout), "pypi" (pip install promptdrift) or "skip" (already installed).
    required: false
    default: "action"

outputs:
  verdict:
    description: "ship, review or fail"
    value: ${{ steps.summarize.outputs.verdict }}
  avg-drift:
    description: "Average drift as a fraction"
    value: ${{ steps.summarize.outputs.avg-drift }}
  regression-rate:
    description: "Share of cases that regressed"
    value: ${{ steps.summarize.outputs.regression-rate }}
  regressions:
    description: "Number of regressed cases"
    value: ${{ steps.summarize.outputs.regressions }}
  improvements:
    description: "Number of improved cases"
    value: ${{ steps.summarize.outputs.improvements }}
  format-changes:
    description: "Number of cases whose output format changed"
    value: ${{ steps.summarize.outputs.format-changes }}
  json-broken:
    description: "Number of cases where valid JSON in A became invalid in B"
    value: ${{ steps.summarize.outputs.json-broken }}
  flips:
    description: "Number of checks that flipped from pass to fail"
    value: ${{ steps.summarize.outputs.flips }}
  inconsistent:
    description: "Number of order-inconsistent judge verdicts"
    value: ${{ steps.summarize.outputs.inconsistent }}
  report-json:
    description: "Path of report.json"
    value: ${{ steps.summarize.outputs.report-json }}
  report-html:
    description: "Path of report.html"
    value: ${{ steps.summarize.outputs.report-html }}
  report-junit:
    description: "Path of report.junit.xml"
    value: ${{ steps.summarize.outputs.report-junit }}
  threshold-failures:
    description: "Number of breached thresholds"
    value: ${{ steps.summarize.outputs.threshold-failures }}
  comment-id:
    description: "Id of the PR comment that was created or updated (empty when none)"
    value: ${{ steps.summarize.outputs.comment-id }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install promptdrift
      id: install
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        case "$INSTALL" in
          action) python -m pip install --quiet "$ACTION_PATH" ;;
          pypi)   python -m pip install --quiet promptdrift ;;
          skip)   echo "install: skip (promptdrift must already be on PATH)" ;;
          *)      echo "::error::promptdrift: unknown install mode '$INSTALL' (use action, pypi or skip)"; exit 1 ;;
        esac
        promptdrift --version

    - name: Run promptdrift
      id: run
      shell: bash
      # Inputs reach the shell only through environment variables and are
      # passed to promptdrift as separate argv entries; nothing is eval'd.
      env:
        INPUT_OUTPUTS: ${{ inputs.outputs }}
        INPUT_CONFIG_A: ${{ inputs.config-a }}
        INPUT_CONFIG_B: ${{ inputs.config-b }}
        INPUT_CASES: ${{ inputs.cases }}
        INPUT_CHECKS: ${{ inputs.checks }}
        INPUT_SAMPLES: ${{ inputs.samples }}
        INPUT_JUDGE: ${{ inputs.judge }}
        INPUT_JUDGE_PROVIDER: ${{ inputs.judge-provider }}
        INPUT_JUDGE_MODEL: ${{ inputs.judge-model }}
        INPUT_SIMILARITY: ${{ inputs.similarity }}
        INPUT_MAX_DRIFT: ${{ inputs.max-drift }}
        INPUT_MAX_REGRESSIONS: ${{ inputs.max-regressions }}
        INPUT_MAX_FORMAT_CHANGES: ${{ inputs.max-format-changes }}
        INPUT_MAX_FLIPS: ${{ inputs.max-flips }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        INPUT_REPORT_DIR: ${{ inputs.report-dir }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set -euo pipefail
        cd "$INPUT_WORKING_DIRECTORY"
        mkdir -p "$INPUT_REPORT_DIR"
        report_dir="$(cd "$INPUT_REPORT_DIR" && pwd)"
        echo "report-dir=$report_dir" >> "$GITHUB_OUTPUT"

        args=()
        if [ -n "$INPUT_OUTPUTS" ]; then
          args+=(diff "$INPUT_OUTPUTS")
          if [ "$INPUT_JUDGE" = "true" ]; then args+=(--judge); fi
        elif [ -n "$INPUT_CONFIG_A" ] && [ -n "$INPUT_CONFIG_B" ]; then
          args+=(compare "$INPUT_CONFIG_A" "$INPUT_CONFIG_B" --cases "$INPUT_CASES")
          args+=(--similarity "$INPUT_SIMILARITY" --samples "$INPUT_SAMPLES")
          if [ "$INPUT_JUDGE" != "true" ]; then args+=(--no-judge); fi
        else
          echo "::error::promptdrift: set 'outputs' (offline) or 'config-a', 'config-b' and 'cases' (live)"
          echo "exit-code=2" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "$INPUT_JUDGE_PROVIDER" ]; then args+=(--judge-provider "$INPUT_JUDGE_PROVIDER"); fi
        if [ -n "$INPUT_JUDGE_MODEL" ]; then args+=(--judge-model "$INPUT_JUDGE_MODEL"); fi
        if [ -n "$INPUT_CHECKS" ]; then args+=(--checks "$INPUT_CHECKS"); fi
        if [ -n "$INPUT_MAX_DRIFT" ]; then args+=(--max-drift "$INPUT_MAX_DRIFT"); fi
        if [ -n "$INPUT_MAX_REGRESSIONS" ]; then args+=(--max-regressions "$INPUT_MAX_REGRESSIONS"); fi
        if [ -n "$INPUT_MAX_FORMAT_CHANGES" ]; then args+=(--max-format-changes "$INPUT_MAX_FORMAT_CHANGES"); fi
        if [ -n "$INPUT_MAX_FLIPS" ]; then args+=(--max-flips "$INPUT_MAX_FLIPS"); fi
        if [ "$INPUT_FAIL_ON_REGRESSION" = "true" ]; then args+=(--fail-on-regression); fi
        args+=(--output "$report_dir/report.json" --html "$report_dir/report.html")
        args+=(--junit "$report_dir/report.junit.xml" --csv "$report_dir/report.csv")
        if [ -n "$INPUT_EXTRA_ARGS" ]; then
          read -r -a extra <<< "$INPUT_EXTRA_ARGS"
          args+=("${extra[@]}")
        fi

        echo "promptdrift ${args[*]}"
        set +e
        promptdrift "${args[@]}"
        rc=$?
        set -e
        echo "promptdrift exit code: $rc"
        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"

    - name: Summarize, comment and set outputs
      id: summarize
      shell: bash
      env:
        PROMPTDRIFT_EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        INPUT_REPORT_DIR: ${{ steps.run.outputs.report-dir }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_COMMENT_MARKER: ${{ inputs.comment-marker }}
        INPUT_STEP_SUMMARY: ${{ inputs.step-summary }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_MAX_DRIFT: ${{ inputs.max-drift }}
        INPUT_MAX_REGRESSIONS: ${{ inputs.max-regressions }}
        INPUT_MAX_FORMAT_CHANGES: ${{ inputs.max-format-changes }}
        INPUT_MAX_FLIPS: ${{ inputs.max-flips }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
      run: python "${{ github.action_path }}/action/summarize.py"

    - name: Upload report artifact
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.report-dir }}
        if-no-files-found: warn

    - name: Fail on thresholds
      if: ${{ always() }}
      shell: bash
      env:
        PROMPTDRIFT_EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        REPORT_DIR: ${{ steps.run.outputs.report-dir }}
      run: |
        rc="${PROMPTDRIFT_EXIT_CODE:-1}"
        if [ "$rc" != "0" ]; then
          echo "promptdrift exited with code $rc"
          if [ -f "$REPORT_DIR/threshold-failures.txt" ]; then
            echo "threshold failures:"
            sed 's/^/  - /' "$REPORT_DIR/threshold-failures.txt"
          fi
          exit "$rc"
        fi
        echo "promptdrift: all thresholds passed"
