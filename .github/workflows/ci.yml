name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every job blanks the provider keys: nothing in CI may reach a paid API.
env:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (whole repository)
        run: ruff check .

      - name: Byte-compile everything that ships (catches syntax newer than 3.9)
        run: python -m compileall -q promptdrift action examples benchmark _promptdrift_pytest.py

      - name: Test with coverage (no network, every provider mocked)
        run: >
          pytest -q --cov=promptdrift --cov=action
          --cov-report=term-missing --cov-fail-under=90

  typecheck:
    name: mypy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy (configuration in pyproject.toml)
        run: python -m mypy promptdrift

  minimal:
    name: core install, no provider SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Offline smoke test
        run: |
          promptdrift --version
          promptdrift diff examples/outputs.jsonl --summary
          pytest -q

  examples:
    name: pytest plugin, offline example, action helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest plugin on the offline example (2 regressions on purpose)
        # The example data regresses on purpose, so the plugin must exit 1 with
        # exactly 17 generated tests (16 cases + summary) and 3 failures.
        run: |
          set +e
          pytest --promptdrift examples/offline/outputs.jsonl \
            --promptdrift-checks examples/offline/checks.yaml \
            --promptdrift-max-drift 0.3 \
            --junit-xml plugin-junit.xml -p no:cacheprovider --rootdir /tmp -q
          code=$?
          set -e
          test "$code" -eq 1
          grep -q 'tests="17"' plugin-junit.xml
          grep -q 'failures="3"' plugin-junit.xml
          echo "plugin exit code $code, junit counts as expected"

      - name: Offline example script (exits 1 on purpose)
        run: |
          set +e
          bash examples/offline/run.sh
          code=$?
          set -e
          test "$code" -eq 1
          test -s examples/offline/out/report.html
          test -s examples/offline/out/junit.xml
          test -s examples/offline/out/report.csv

      - name: Python API, scripted live provider, benchmark (no network)
        run: |
          python examples/python_api.py
          python examples/live/mock_provider.py
          python benchmark/run_benchmark.py --no-embeddings --no-write

      - name: Action helper, example and benchmark test modules
        run: pytest -q tests/test_action.py tests/test_examples.py tests/test_benchmark.py

  package:
    name: build and twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: The sdist carries the action, examples and tests
        run: |
          tar tzf dist/*.tar.gz | grep -q 'action.yml'
          tar tzf dist/*.tar.gz | grep -q 'action/summarize.py'
          tar tzf dist/*.tar.gz | grep -q 'examples/offline/outputs.jsonl'
          tar tzf dist/*.tar.gz | grep -q 'tests/test_core.py'
      - name: Install the wheel and run it
        run: |
          pip install dist/*.whl
          cd /tmp && promptdrift --version
