# Documentation site (mkdocs-material).
#
# On pull requests: build with --strict as a check, nothing is deployed.
# On push to main, or a manual run (workflow_dispatch) on main: build and
# deploy to this repository's own GitHub Pages
# (https://dakshtrehan.github.io/promptdrift/). Nothing else is published.
#
# Pages must be enabled once in the repository settings with "GitHub Actions"
# as the source, before the first push to main (RELEASE.md step 2). If it was
# not, the deploy job fails; enable Pages, then re-run this workflow from the
# Actions tab (workflow_dispatch on main) or re-run the failed jobs.

name: docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install promptdrift and the docs toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build (strict, any warning fails)
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: mkdocs build --strict

      - name: Reject em and en dashes in the docs
        run: |
          # U+2013 and U+2014 as UTF-8 bytes, so the check does not depend on the locale.
          if LC_ALL=C grep -rn -e $'\xe2\x80\x93' -e $'\xe2\x80\x94' docs --include="*.md" mkdocs.yml; then
            echo "::error::em or en dash found in the docs"
            exit 1
          fi

      # No configure-pages step: site_url is fixed in mkdocs.yml, nothing needs
      # its outputs, and it fails the build job while Pages is not enabled.
      - name: Upload the site as the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
